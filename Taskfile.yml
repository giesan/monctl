version: '3'

tasks:
  default:
    desc: Build the local GUI executable
    cmds:
      - task: build

  build:
    desc: Build monctl with the desktop window into build/monctl
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -tags=nucular_shiny -o build/monctl ./cmd/monctl

  run:
    desc: Rebuild and start the local desktop window
    cmds:
      - task: build
      - ./build/monctl

  test:
    desc: Test CLI and GUI configurations
    cmds:
      - go test ./...
      - CGO_ENABLED=0 go test -tags=nucular_shiny ./...

  package:
    desc: Build Arch/Manjaro snapshot packages (replaces dist/)
    cmds:
      - goreleaser release --snapshot --clean
