version: '3'

tasks:
  default:
    desc: Build the local GUI executable
    cmds:
      - task: build

  build:
    desc: Build monctl with the GTK desktop window into build/monctl
    cmds:
      - mkdir -p build
      - CGO_ENABLED=1 go build -tags=gtk -o build/monctl ./cmd/monctl

  run:
    desc: Rebuild and start the local desktop window
    cmds:
      - task: build
      - ./build/monctl

  test:
    desc: Test headless CLI and GTK GUI configurations
    cmds:
      - CGO_ENABLED=0 go test ./...
      - CGO_ENABLED=1 go test -tags=gtk ./...

  package:
    desc: Build Arch/Manjaro and Debian/Ubuntu snapshots (replaces dist/)
    cmds:
      - goreleaser release --snapshot --clean
