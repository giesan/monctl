version: 2
project_name: monctl

release:
  disable: true

builds:
  - id: monctl
    main: ./cmd/monctl
    binary: monctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: monctl-tray
    main: ./cmd/monctl-tray
    binary: monctl-tray
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: monctl-window
    main: ./cmd/monctl-window
    binary: monctl-window
    flags:
      - -tags=nucular_shiny
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

nfpms:
  - id: archlinux
    package_name: monctl
    builds:
      - monctl
      - monctl-tray
      - monctl-window
    formats:
      - archlinux
    maintainer: monctl contributors
    description: Control external monitor settings and laptop brightness on Linux
    bindir: /usr/bin
    dependencies:
      - ddcutil
      - systemd
