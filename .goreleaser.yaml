version: 2
project_name: monctl

release:
  disable: true

builds:
  - id: monctl
    main: ./cmd/monctl
    binary: monctl
    flags:
      - -tags=gtk
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64

nfpms:
  - id: archlinux
    package_name: monctl
    builds:
      - monctl
    formats:
      - archlinux
    maintainer: monctl contributors
    description: Control external monitor settings and laptop brightness on Linux
    bindir: /usr/bin
    dependencies:
      - ddcutil
      - systemd
      - gtk3
    contents:
      - src: assets/monctl.desktop
        dst: /usr/share/applications/monctl.desktop
      - src: internal/window/icons/monctl-16.png
        dst: /usr/share/icons/hicolor/16x16/apps/monctl.png
      - src: internal/window/icons/monctl-24.png
        dst: /usr/share/icons/hicolor/24x24/apps/monctl.png
      - src: internal/window/icons/monctl-48.png
        dst: /usr/share/icons/hicolor/48x48/apps/monctl.png
      - src: internal/window/icons/monctl-128.png
        dst: /usr/share/icons/hicolor/128x128/apps/monctl.png
  - id: debian
    package_name: monctl
    builds:
      - monctl
    formats:
      - deb
    maintainer: monctl contributors
    description: Control external monitor settings and laptop brightness on Linux
    bindir: /usr/bin
    dependencies:
      - ddcutil
      - systemd
      - libgtk-3-0 | libgtk-3-0t64
    contents:
      - src: assets/monctl.desktop
        dst: /usr/share/applications/monctl.desktop
      - src: internal/window/icons/monctl-16.png
        dst: /usr/share/icons/hicolor/16x16/apps/monctl.png
      - src: internal/window/icons/monctl-24.png
        dst: /usr/share/icons/hicolor/24x24/apps/monctl.png
      - src: internal/window/icons/monctl-48.png
        dst: /usr/share/icons/hicolor/48x48/apps/monctl.png
      - src: internal/window/icons/monctl-128.png
        dst: /usr/share/icons/hicolor/128x128/apps/monctl.png
